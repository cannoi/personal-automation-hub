<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Automation Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>.paf-made-by{position:fixed;right:8px;bottom:8px;width:min(72px,12vw);max-width:12vw;height:auto;object-fit:contain;opacity:.5;background:transparent;padding:0;border:0;box-shadow:none;filter:none;pointer-events:none;z-index:30}</style></head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
  <div class="max-w-6xl w-full mx-auto p-6 flex-grow">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Personal Automation Hub</h1>
        <p class="text-slate-400 text-sm">Create, manage, and test your IF-THEN rules locally.</p>
      </div>
      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg transition shadow-lg shadow-blue-900/30 flex items-center gap-2">
        <span>+ Create Rule</span>
      </button>
    </header>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Total Rules</p>
        <p id="stat-total" class="text-2xl font-semibold mt-1">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Active Automations</p>
        <p id="stat-active" class="text-2xl font-semibold mt-1 text-emerald-400">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
        <p class="text-slate-400 text-sm">Total Executions</p>
        <p id="stat-executions" class="text-2xl font-semibold mt-1 text-blue-400">0</p>
      </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Rules List -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-semibold border-b border-slate-800 pb-2">Active Rules</h2>
        <div id="rules-container" class="space-y-3">
          <!-- Dynamically populated -->
          <div class="text-slate-500 text-sm py-4">Loading rules...</div>
        </div>
      </div>

      <!-- Execution Logs -->
      <div class="space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h2 class="text-lg font-semibold">Activity Log</h2>
          <button onclick="loadLogs()" class="text-xs text-slate-400 hover:text-white">Refresh</button>
        </div>
        <div id="logs-container" class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
          <div class="text-slate-500 text-sm py-4">Loading logs...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Modal -->
  <div id="rule-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <h3 class="text-xl font-semibold mb-4">Create Automation Rule</h3>
      <form id="rule-form" onsubmit="submitRule(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Rule Name</label>
          <input type="text" id="rule-name" required placeholder="e.g., Morning Webhook Notification" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Trigger (When X)</label>
            <select id="trigger-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none">
              <option value="webhook">Incoming Webhook</option>
              <option value="timer">Scheduled Timer</option>
              <option value="button">Manual Button Click</option>
            </select>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Action (Then Y)</label>
            <select id="action-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none">
              <option value="notification">Send Notification</option>
              <option value="log">Log Activity</option>
              <option value="trigger_webhook">Trigger Webhook</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Payload / Configuration Note</label>
          <input type="text" id="rule-config" placeholder="e.g., target_url or message content" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none">
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition">Save Rule</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer Badge -->
  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
    <span class="paf-made-by">Made with App Builder — Pi SoloHost</span>
  </footer>

  <script>
    async function loadData() {
      try {
        const res = await fetch('/api/rules');
        const data = await res.json();
        document.getElementById('stat-total').textContent = data.stats.total;
        document.getElementById('stat-active').textContent = data.stats.active;
        document.getElementById('stat-executions').textContent = data.stats.executions;

        const container = document.getElementById('rules-container');
        if (data.rules.length === 0) {
          container.innerHTML = '<div class="text-slate-500 text-sm py-4 bg-slate-800/30 rounded-xl p-4 text-center border border-slate-800">No rules created yet. Click "Create Rule" to get started.</div>';
          return;
        }

        container.innerHTML = data.rules.map(rule => `
          <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4 flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="font-medium text-white">${escapeHtml(rule.name)}</h3>
                <span class="text-xs px-2 py-0.5 rounded ${rule.active ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-700 text-slate-400'}">
                  ${rule.active ? 'Active' : 'Paused'}
                </span>
              </div>
              <p class="text-xs text-slate-400 mt-1">When <span class="text-blue-400 font-mono">${escapeHtml(rule.trigger_type)}</span> → Then <span class="text-indigo-400 font-mono">${escapeHtml(rule.action_type)}</span></p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="testRule(${rule.id})" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1.5 rounded-lg transition">Test Run</button>
              <button onclick="toggleRule(${rule.id})" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg transition">${rule.active ? 'Pause' : 'Resume'}</button>
              <button onclick="deleteRule(${rule.id})" class="text-slate-500 hover:text-red-400 text-xs p-1.5">🗑️</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load rules', err);
      }
    }

    async function loadLogs() {
      try {
        const res = await fetch('/api/logs');
        const logs = await res.json();
        const container = document.getElementById('logs-container');
        if (logs.length === 0) {
          container.innerHTML = '<div class="text-slate-500 text-sm py-4 text-center">No activity recorded yet.</div>';
          return;
        }

        container.innerHTML = logs.map(log => `
          <div class="bg-slate-900/60 border border-slate-800 rounded-lg p-3 text-xs">
            <div class="flex justify-between items-center mb-1">
              <span class="font-medium text-slate-300">${escapeHtml(log.rule_name || 'Deleted Rule')}</span>
              <span class="text-slate-500 text-[10px]">${new Date(log.executed_at).toLocaleTimeString()}</span>
            </div>
            <p class="text-slate-400">${escapeHtml(log.message)}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load logs', err);
      }
    }

    function openModal() {
      document.getElementById('rule-modal').classList.remove('hidden');
      document.getElementById('rule-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('rule-modal').classList.remove('flex');
      document.getElementById('rule-modal').classList.add('hidden');
    }

    async function submitRule(e) {
      e.preventDefault();
      const name = document.getElementById('rule-name').value;
      const trigger_type = document.getElementById('trigger-type').value;
      const action_type = document.getElementById('action-type').value;
      const config = document.getElementById('rule-config').value;

      try {
        const res = await fetch('/api/rules', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, trigger_type, trigger_config: { note: config }, action_type, action_config: { note: config } })
        });
        if (res.ok) {
          closeModal();
          document.getElementById('rule-form').reset();
          loadData();
          loadLogs();
        }
      } catch (err) {
        alert('Failed to create rule');
      }
    }

    async function testRule(id) {
      try {
        const res = await fetch(`/api/rules/${id}/test`, { method: 'POST' });
        const data = await res.json();
        if (res.ok) {
          loadData();
          loadLogs();
        } else {
          alert(data.error || 'Simulation failed');
        }
      } catch (err) {
        alert('Test execution error');
      }
    }

    async function toggleRule(id) {
      await fetch(`/api/rules/${id}/toggle`, { method: 'PATCH' });
      loadData();
    }

    async function deleteRule(id) {
      if (confirm('Are you sure you want to delete this rule?')) {
        await fetch(`/api/rules/${id}`, { method: 'DELETE' });
        loadData();
        loadLogs();
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
    loadLogs();
    setInterval(loadLogs, 10000);
  </script>
<img class="paf-made-by" src="/made-by.png" alt="Made with App Builder — Pi SoloHost"></body>
</html>
